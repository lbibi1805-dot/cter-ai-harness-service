services:
  - type: web
    name: canvasfilehelper
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /ping   # (13) không chạm DB; /health cũng không query DB nhưng /ping không phụ thuộc gì
    # Full reference: docs/DEPLOYMENT-GUIDE.md §4. `sync: false` = secret, set in the dashboard.
    envVars:
      # ── Required ──
      - key: API_PORT
        value: 3000
      - key: CANVAS_URL_1
        sync: false
      - key: CANVAS_KEY_1
        sync: false
      - key: CANVAS_EMAIL_1
        sync: false
      - key: VAULT_STORAGE_PROVIDER
        value: postgres-r2
      - key: DATABASE_URL
        sync: false
      # ── Object storage: Cloudflare R2, one bucket per environment (prod: cter-prod). Token scoped to that bucket. ──
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: cter-prod
      # ── Server-side conversations + context engineering (feature flag; enable after the smoke test) ──
      - key: CONVERSATION_STORE_ENABLED
        value: "false"
      - key: CONVERSATION_PURGE_DAYS
        value: 30
      - key: AUX_PROVIDER
        value: gemini
      - key: AUX_MODEL
        value: gemini-3.1-flash-lite
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      # ── OpenRouter: backend fallback after the direct route; enabled when OPENROUTER_API_KEY is set ──
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_APP_TITLE
        value: CTER AI Harness
      - key: OPENROUTER_MODEL_CLAUDE
        sync: false
      - key: OPENROUTER_FALLBACK_CLAUDE
        sync: false
      - key: OPENROUTER_MODEL_GEMINI
        sync: false
      - key: OPENROUTER_FALLBACK_GEMINI
        sync: false
      - key: OPENROUTER_MODEL_GROK
        sync: false
      - key: OPENROUTER_FALLBACK_GROK
        sync: false
      - key: OPENROUTER_MODEL_OPENAI
        sync: false
      - key: OPENROUTER_FALLBACK_OPENAI
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # Bearer for POST /api/chat (desktop client "API server" chat). Unset = chat API disabled (503).
      - key: CHAT_API_TOKEN
        sync: false
      # ── Photo capture API /api/captures for the cter-capture-client web app (planning-13112026-photo-capture). Add its Vercel origin to FRONTEND_URL. ──
      # Uploads are public (no key). CAPTURE_API_KEY = read/delete key for receiver backends only + module switch (unset = every route 503).
      - key: CAPTURE_API_KEY
        sync: false
      - key: CAPTURE_R2_BUCKET           # own bucket; unset = shared R2_BUCKET under captures/
        sync: false                     # e.g. cter-capture-prod
      - key: CAPTURE_R2_ACCESS_KEY_ID    # token scoped to cter-capture-prod; unset = R2_ACCESS_KEY_ID
        sync: false
      - key: CAPTURE_R2_SECRET_ACCESS_KEY
        sync: false
      # ── Operations ──
      - key: POLL_INTERVAL_MS
        value: 30000
      - key: POLL_AUTOSTART
        value: "true"
      - key: RAG_TOP_K
        value: 8
      - key: RAG_MIN_SCORE
        value: 0.3
      - key: AI_TIMEOUT_MS
        value: 120000
      # ── Latency (07) ──
      - key: MAX_RETRY_COUNT
        value: 2
      - key: AI_FIRST_TOKEN_TIMEOUT_MS
        value: 15000
      - key: AI_IDLE_TIMEOUT_MS
        value: 20000
      - key: CHAT_DEADLINE_MS
        value: 90000
      # Canvas polling (file Q&A + Canvas conversation): long PDF answers need more than the chat deadline
      - key: CANVAS_DEADLINE_MS
        value: 300000
      - key: GEMINI_THINKING_LEVEL
        value: minimal
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_PROMPT_CACHE_KEY
        value: conversation
      # ── KV cache (18) ──
      - key: PROMPT_CACHE_LAYOUT
        value: v2
      - key: PROMPT_CACHE_CLAUDE
        value: "false"
      # Images of the last N user/assistant pairs stay in place in history; 0 = rollback (JIT only)
      - key: CONTEXT_HOT_WINDOW_TURNS
        value: 2
      # ── Chat images (09) ──
      - key: MAX_CHAT_IMAGES
        value: 10
      # ── Artifact Resolver (17) ──
      - key: ARTIFACT_RESOLVER_MODE
        value: rules+aux
      # ── Essay (15) ──
      - key: HYBRID_SEARCH_ENABLED
        value: "true"
      - key: ESSAY_MODE_ENABLED
        value: "false"
      - key: ESSAY_MAX_ASPECTS
        value: 12
      # ── Long, complete answers (12/11 plan 08) ──
      - key: AI_MAX_OUTPUT_TOKENS
        value: 16384
      - key: ANSWER_COMPLETENESS_ENABLED
        value: "true"
      - key: ANSWER_MIN_WORDS_PER_QUESTION
        value: 300
      - key: ANSWER_SECTION_MAX_QUESTIONS
        value: 3
      - key: ANSWER_MAX_CONTINUATIONS
        value: 2
      - key: ANSWER_COVERAGE_FIX
        value: "true"
      - key: LONG_ANSWER_DEADLINE_MS
        value: 240000
      - key: HISTORY_ASSISTANT_TURN_MAX_CHARS
        value: 12000
      # ── Neon cost (13 §3.1) ──
      - key: POLL_CURSOR_FLUSH_MS
        value: 900000
      - key: CRON_ENABLED
        value: "true"
      - key: CRON_INTERVAL_MS
        value: 720000
      - key: FRONTEND_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # ── Agent mode ──
      - key: AGENT_MAX_TOOL_CALLS
        value: 6
      - key: AGENT_MIN_TOOL_CALLS
        value: 1
      - key: AGENT_MAX_DURATION_MS
        value: 180000
      - key: AGENT_MAX_DIAGRAM_VALIDATIONS
        value: 3
      # ── Diagram syntax guard (12/11 plan 03): render + repair PlantUML blocks after an answer ──
      - key: DIAGRAM_SYNTAX_GUARD_ENABLED
        value: true
      - key: DIAGRAM_SYNTAX_MAX_REPAIRS
        value: 1
      # ── Design rules (12/11 plan 04): connectivity check C1–C9 + chat lint; /c4 design discussion T1–T7 ──
      - key: DIAGRAM_CONNECTIVITY_CHECK
        value: true
      - key: C4_DESIGN_DISCUSSION_ENABLED
        value: true
      # ── Reranking: none = cosine order only. Set pinecone once the Pinecone plan has rerank quota. ──
      - key: RERANK_PROVIDER
        value: none
      - key: RERANK_MODEL
        value: bge-reranker-v2-m3
      - key: RERANK_CANDIDATES
        value: 40
      - key: RERANK_TOP_N
        value: 8
      - key: RERANK_TIMEOUT_MS
        value: 5000
